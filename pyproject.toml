[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automotive-graphrag"
version = "0.1.0"
description = "Automotive repair manual GraphRAG management interface"
requires-python = ">=3.11"
dependencies = [
    "graphrag>=3.2,<3.3",
    "gradio>=6.29,<6.30",
    "pandas>=3.0,<3.1",
    "pyarrow>=25,<26",
    "pypdf>=6.19,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
automotive-graphrag = "automotive_graphrag.portal:main"
automotive-graphrag-admin = "automotive_graphrag.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
