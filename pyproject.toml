[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automotive-graphrag"
version = "0.1.0"
description = "Automotive repair manual GraphRAG management interface"
requires-python = ">=3.11"
dependencies = [
    "graphrag>=3,<4",
    "gradio>=5,<7",
    "pandas>=2,<3",
    "pyarrow>=15",
    "pypdf>=5,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
automotive-graphrag = "automotive_graphrag.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
